<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Trades overlay</title>
<style>
  :root { --bg: rgba(13, 17, 23, .88); --line: #30363d; --fg: #e6edf3; --muted: #8b949e;
          --green: #3fb950; --red: #f85149; --orange: #f0883e; --blue: #58a6ff; }
  html, body { margin: 0; background: transparent; font-family: "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  .panel { width: 540px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px;
           padding: 14px 16px 10px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  .top { display: flex; align-items: center; gap: 8px; }
  .badge { font-weight: 800; letter-spacing: .08em; font-size: 13px; padding: 4px 10px; border-radius: 999px;
           background: linear-gradient(90deg, #1f6feb, #8957e5); }
  .phase { margin-left: auto; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block;
         margin-right: 6px; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .pos { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .pos .sym { font-size: 26px; font-weight: 800; }
  .pos .strat { font-size: 12px; color: var(--blue); margin-left: 8px; }
  .pos .pnl { float: right; font-size: 24px; font-weight: 800; }
  .levels { display: flex; gap: 18px; margin-top: 4px; font-size: 13px; color: var(--muted); }
  .levels b { color: var(--fg); }
  .idle { color: var(--muted); font-size: 14px; }
  .stats { display: flex; gap: 8px; margin-top: 10px; }
  .stat { flex: 1; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .stat .v { font-size: 18px; font-weight: 800; }
  .stat .k { font-size: 10px; color: var(--muted); letter-spacing: .08em; }
  .caption { margin-top: 10px; font-size: 15px; line-height: 1.35; min-height: 42px; }
  .caption .t { color: var(--muted); font-size: 12px; margin-right: 6px; }
  .foot { margin-top: 8px; font-size: 10.5px; color: var(--muted); letter-spacing: .03em; }
  .up { color: var(--green); } .down { color: var(--red); }
</style>
</head>
<body>
<div class="panel">
  <div class="top">
    <span class="badge">TRADES</span>
    <span class="phase"><span class="dot"></span><span id="phase">starting</span></span>
  </div>
  <div class="pos" id="pos"><div class="idle">Waiting for a setup…</div></div>
  <div class="stats">
    <div class="stat"><div class="v" id="trades">0/5</div><div class="k">TRADES</div></div>
    <div class="stat"><div class="v" id="wl">0W / 0L</div><div class="k">WIN / LOSS</div></div>
    <div class="stat"><div class="v" id="pnl">$0</div><div class="k">DAY P&amp;L</div></div>
    <div class="stat"><div class="v" id="strikes">0/3</div><div class="k">LOSSES TO STOP</div></div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="foot">Not financial advice</div>
</div>
<script>
const $ = id => document.getElementById(id);
const money = v => (v >= 0 ? "+$" : "-$") + Math.abs(v).toFixed(0);
let lastCaption = "";
async function tick() {
  try {
    const s = await (await fetch("/state", {cache: "no-store"})).json();
    const st = s.stats || {};
    $("phase").textContent = (s.mode === "watch" ? "watch only • " : s.mode === "replay" ? "replay • " : s.mode === "simulation" ? "simulation • " : "") + (s.phase || "");
    $("trades").textContent = `${st.trades || 0}/${st.max_trades || 5}`;
    $("wl").textContent = `${st.wins || 0}W / ${st.losses || 0}L`;
    const pnl = st.pnl || 0;
    $("pnl").textContent = money(pnl);
    $("pnl").className = "v " + (pnl > 0 ? "up" : pnl < 0 ? "down" : "");
    $("strikes").textContent = `${st.losses || 0}/${st.max_losses || 3}`;
    const p = s.position;
    if (p) {
      const u = p.unrealized;
      $("pos").innerHTML = `<span class="sym">${p.symbol}</span><span class="strat">${p.strategy}</span>` +
        (u == null ? "" : `<span class="pnl ${u >= 0 ? "up" : "down"}">${money(u)}</span>`) +
        `<div class="levels"><span>Qty <b>${p.qty}</b></span><span>Entry <b>${(p.fill || p.entry).toFixed(2)}</b></span>` +
        `<span>Stop <b class="down">${p.stop.toFixed(2)}</b></span><span>Target <b class="up">${p.target.toFixed(2)}</b></span></div>`;
    } else {
      const w = (s.watching || []).slice(0, 6).join(" · ");
      $("pos").innerHTML = `<div class="idle">${w ? "Watching: <b style='color:#e6edf3'>" + w + "</b>" : "Waiting for a setup…"}</div>`;
    }
    const c = (s.captions || []).slice(-1)[0];
    if (c && c.text !== lastCaption) {
      lastCaption = c.text;
      $("caption").innerHTML = `<span class="t">${c.at}</span>${c.text}`;
    }
  } catch (e) { /* trader not running yet */ }
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
