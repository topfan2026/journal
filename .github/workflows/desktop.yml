name: Build ChartDesk desktop app

on:
  push:
    paths: ['trading-platform/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: trading-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trading-platform/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          # unsigned builds: no code-signing certificates configured
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ChartDesk-${{ matrix.name }}
          path: |
            trading-platform/release/*.exe
            trading-platform/release/*.dmg
            trading-platform/release/*.AppImage
          if-no-files-found: error
