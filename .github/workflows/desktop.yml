name: Build ChartDesk desktop app

on:
  push:
    paths: ['trading-platform/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

# Every run publishes a GitHub Release (v0.3.<run number>); installed apps update from it.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: trading-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trading-platform/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Set version from run number
        run: npm version 0.3.${{ github.run_number }} --no-git-tag-version
      - run: npm run dist
        env:
          # unsigned builds: no code-signing certificates configured
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ChartDesk-${{ matrix.name }}
          path: |
            trading-platform/release/*.exe
            trading-platform/release/*.dmg
            trading-platform/release/*.AppImage
            trading-platform/release/*.blockmap
            trading-platform/release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.3.${{ github.run_number }}
        run: |
          ls -la dist
          gh release create "v$VERSION" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "ChartDesk $VERSION" \
            --notes "Built from ${{ github.sha }}. Installed copies of ChartDesk on Windows and Linux update to this automatically. First install: download ChartDesk-Setup-$VERSION.exe (Windows), the .dmg (Mac) or the .AppImage (Linux) below."
